<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Space Invaders</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stars"></div>
  <div class="game-wrap">
    <h1>Space Invaders</h1>
    <div class="hud">
      <div>SCORE <span id="score">0000</span></div>
      <div>HIGH <span id="high">0000</span></div>
      <div>LEVEL <span class="level" id="level">1</span></div>
      <div>DIFF <span class="diff" id="diff">NORMAL</span></div>
      <div>SUPER <span class="super" id="super">TRIPLE</span></div>
      <div>LIVES <span class="lives" id="lives">3</span></div>
    </div>
    <div class="stage">
      <canvas id="game" width="640" height="560"></canvas>
      <button id="pauseBtn" class="pause-btn" aria-label="Pause">⏸</button>
    </div>

    <div class="touch-controls" id="touchControls">
      <div class="tc-group">
        <button class="tc-btn" id="btnUp" aria-label="Up">▲</button>
        <button class="tc-btn" id="btnDown" aria-label="Down">▼</button>
        <button class="tc-btn" id="btnLeft" aria-label="Left">◀</button>
        <button class="tc-btn" id="btnRight" aria-label="Right">▶</button>
        <button class="tc-btn small back" id="btnBack" aria-label="Back">BACK</button>
      </div>
      <div class="tc-group">
        <button class="tc-btn fire" id="btnFire" aria-label="Fire">FIRE</button>
      </div>
    </div>

    <div class="controls">
      <b>&larr; &rarr;</b> move &nbsp;|&nbsp; <b>Space</b> fire &nbsp;|&nbsp; <b>P</b> pause &nbsp;|&nbsp; <b>M</b> sound &nbsp;|&nbsp; <b>Enter</b> start / restart
    </div>
    <div class="touch-hint">
      drag to move · tap <b>FIRE</b> to shoot · <b>▲▼</b> choose in menus
    </div>
    <button id="muteBtn" class="mute-btn">🔊 Sound On</button>
    <button id="optionsBtn" class="options-btn" aria-label="Options">⚙ OPTIONS</button>
  </div>

  <div id="optionsOverlay" class="options-overlay" hidden>
    <div class="options-panel">
      <h2>OPTIONS</h2>
      <label for="musicVol">MUSIC VOLUME</label>
      <input type="range" id="musicVol" min="0" max="100" step="5" value="60">
      <div><span id="musicVolLabel" class="vol-label">60%</span></div>
      <button id="optionsClose" class="options-close">CLOSE</button>
    </div>
  </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
